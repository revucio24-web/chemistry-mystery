<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#0c192e"/>
      <stop offset="100%" stopColor="#030712"/>
    </radialGradient>

    <!-- Flask Liquid Gradient -->
    <linearGradient id="liquid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="50%" stopColor="#06b6d4"/>
      <stop offset="100%" stopColor="#0284c7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="50%" stopColor="#eab308"/>
      <stop offset="100%" stopColor="#ca8a04"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Orbital Rings in Background -->
  <g transform="translate(256, 260)" stroke="#0284c7" stroke-width="2.5" fill="none" opacity="0.45" stroke-dasharray="6 6">
    <ellipse rx="190" ry="70" transform="rotate(-30)"/>
    <ellipse rx="190" ry="70" transform="rotate(30)"/>
    <ellipse rx="190" ry="70" transform="rotate(90)"/>
  </g>

  <!-- Orbiting Electrons -->
  <circle cx="100" cy="180" r="10" fill="#38bdf8" filter="url(#neon-glow)"/>
  <circle cx="410" cy="340" r="10" fill="#38bdf8" filter="url(#neon-glow)"/>
  <circle cx="390" cy="160" r="8" fill="#facc15" filter="url(#neon-glow)"/>
  <circle cx="130" cy="370" r="8" fill="#facc15" filter="url(#neon-glow)"/>

  <!-- Science Flask Silhouette -->
  <g filter="url(#neon-glow)">
    <!-- Flask Liquid Fill -->
    <path d="M 200 240 L 140 370 A 24 24 0 0 0 162 400 L 350 400 A 24 24 0 0 0 372 370 L 312 240 Z" fill="url(#liquid-grad)" opacity="0.85"/>

    <!-- Bubbles in Liquid -->
    <circle cx="230" cy="350" r="8" fill="#ffffff" opacity="0.6"/>
    <circle cx="280" cy="330" r="12" fill="#ffffff" opacity="0.5"/>
    <circle cx="250" cy="290" r="6" fill="#ffffff" opacity="0.7"/>

    <!-- Glass Flask Contour -->
    <path d="M 226 120 L 226 210 L 144 374 A 28 28 0 0 0 168 412 L 344 412 A 28 28 0 0 0 368 374 L 286 210 L 286 120 Z" 
          fill="none" stroke="#e0f2fe" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Flask Lip -->
    <rect x="210" y="108" width="92" height="14" rx="7" fill="#e0f2fe"/>
  </g>

  <!-- Central Atom Core Symbol (Z=1 Hydrogen / Alchemy Star) -->
  <circle cx="256" cy="310" r="28" fill="url(#gold-grad)" filter="url(#neon-glow)"/>
  <text x="256" y="319" font-family="monospace, sans-serif" font-weight="900" font-size="24" fill="#030712" text-anchor="middle">e⁻</text>
</svg>
