",name:"Die Atomkammer",subtitle:"Tief im Kern der Dinge",description:"Blicke in das Innere der Atome. Entschlüssele Protonen, Neutronen, Elektronen und erfahre, wie elektrische Ladungen und Ionen entstehen.",requiredLevel:2,themeColor:"indigo",accentColor:"#6366f1",iconName:"Orbit",learningFocus:"Modul B: Atome, Ionen & Ladungen",missionsCount:4,status:"locked"},{id:"molecule_workshop",name:"Die Molekülwerkstatt",subtitle:"Chemische Bindungen knüpfen",description:"Kombiniere Atome zu Molekülen! Baue Wasser, Kohlendioxid und organische Moleküle zusammen und verstehe chemische Formeln.",requiredLevel:3,themeColor:"emerald",accentColor:"#10b981",iconName:"Share2",learningFocus:"Modul B & E: Moleküle, Verbindungen & Formeln",missionsCount:4,status:"locked"},{id:"reaction_room",name:"Der Reaktionsraum",subtitle:"Masse bleibt erhalten",description:"Wo Stoffe sich verwandeln! Gleiche chemische Reaktionsgleichungen stöchiometrisch aus und beobachte die Gesetze der Massenerhaltung.",requiredLevel:4,themeColor:"amber",accentColor:"#f59e0b",iconName:"Flame",learningFocus:"Modul C: Chemische Reaktionen & Gleichungen ausgleichen",missionsCount:4,status:"locked"},{id:"crystal_archive",name:"Das Kristallarchiv",subtitle:"Ordnung der Feststoffe",description:"Erforsche Ionengitter, Salzkristalle und die feinen Unterschiede zwischen physikalischen Aggregatzuständen und chemischen Veränderungen.",requiredLevel:5,themeColor:"violet",accentColor:"#8b5cf6",iconName:"Gem",learningFocus:"Modul F: Zustände, Kristallgitter & Stoffeigenschaften",missionsCount:4,status:"locked"},{id:"water_station",name:"Die Wasserstation",subtitle:"Säuren, Basen & pH-Gleichgewicht",description:"Untersuche wässrige Lösungen, Indikatoren und die pH-Skala von Zitronensaft bis zu Seifenlauge. Was macht Wasser so einzigartig?",requiredLevel:6,themeColor:"sky",accentColor:"#0ea5e9",iconName:"Droplets",learningFocus:"Modul D & E: Säuren, Basen, pH-Wert & Wasser",missionsCount:4,status:"locked"},{id:"environmental_lab",name:"Das Umweltlabor",subtitle:"Nachhaltige Chemie der Zukunft",description:"Löse reale Zukunftsfragen: Batterietechnologie, Wasseraufbereitung, Plastik-Recycling und grüne Synthesen für unseren Planeten.",requiredLevel:7,themeColor:"lime",accentColor:"#84cc16",iconName:"Leaf",learningFocus:"Modul G: Zukunftschemie, Akkus & Umweltschutz",missionsCount:4,status:"locked"},{id:"secret_research_lab",name:"Das geheime Forschungslabor",subtitle:"Das finale Meisterschaftsrätsel",description:"Der Hochsicherheitsbereich für echte Meister! Nur wer alle Disziplinen beherrscht, kann das letzte große Mysterium des Instituts lösen.",requiredLevel:8,themeColor:"fuchsia",accentColor:"#d946ef",iconName:"Sparkles",learningFocus:"Finale Meisterprüfung: Synthese aller Module",missionsCount:2,status:"locked"}],ur=[{id:"h2o",formula:"H₂O",name:"Wasser",commonName:"Wasser",description:"Besteht aus einem zentralen Sauerstoffatom, an das zwei Wasserstoffatome gewinkelt gebunden sind. Ein Dipolmolekül mit Wasserstoffbrückenbindungen.",realWorldUsage:"Lebenselixier der Erde, Lösungsmittel in Zellen, Meere und Trinkwasser.",requiredAtoms:{H:2,O:1},bondsCount:2,difficulty:"explorer"},{id:"o2",formula:"O₂",name:"Molekularer Sauerstoff",commonName:"Sauerstoffgas",description:"Zwei Sauerstoffatome teilen sich vier Elektronen in einer stabilen kovalenten Doppelbindung.",realWorldUsage:"In der Atemluft für die Energieerzeugung in Mitochondrien unerlässlich.",requiredAtoms:{O:2},bondsCount:1,difficulty:"explorer"},{id:"co2",formula:"CO₂",name:"Kohlenstoffdioxid",commonName:"Kohlendioxid",description:"Ein lineares Molekül, in dem Kohlenstoff im Zentrum steht und mit jeweils einer Doppelbindung an zwei Sauerstoffatome gekoppelt ist.",realWorldUsage:"Treibhausgas, Kohlensäure in Mineralwasser und Ausgangsstoff der pflanzlichen Fotosynthese.",requiredAtoms:{C:1,O:2},bondsCount:2,difficulty:"beginner"},{id:"ch4",formula:"CH₄",name:"Methan",commonName:"Erdgas",description:"Das einfachste Alkan. Ein Kohlenstoffatom bildet vier Einfachbindungen zu vier Wasserstoffatomen in einer perfekten Tetraeder-Form.",realWorldUsage:"Hauptbestandteil von Erdgas zum Heizen und Kochen; starkes Treibhausgas.",requiredAtoms:{C:1,H:4},bondsCount:4,difficulty:"beginner"},{id:"nh3",formula:"NH₃",name:"Ammoniak",commonName:"Ammoniak",description:"Ein Stickstoffatom bindet drei Wasserstoffe in einer trigonal-pyramidalen Anordnung mit einem freien Elektronenpaar an der Spitze.",realWorldUsage:"Herstellung von Stickstoffdüngern über das Haber-Bosch-Verfahren und Kältemittel.",requiredAtoms:{N:1,H:3},bondsCount:3,difficulty:"advanced"},{id:"nacl",formula:"NaCl",name:"Natriumchlorid",commonName:"Kochsalz",description:"Eine Ionenverbindung! Natrium gibt ein Elektron ab (Na⁺), Chlor nimmt es auf (Cl⁻). Sie bilden ein kubisches Kristallgitter.",realWorldUsage:"Speisesalz zur Geschmacksgebung, Konservierung und lebenswichtiger Elektrolyt im Blut.",requiredAtoms:{Na:1,Cl:1},bondsCount:1,difficulty:"explorer"}],_s=[{id:"rx_water_synthesis",title:"Die Knallgasreaktion (Wassersynthese)",description:"Wasserstoff reagiert mit Sauerstoff zu flüssigem Wasser. Setze die Koeffizienten so, dass links und rechts gleich viele H- und O-Atome stehen!",reactants:[{coefficient:1,formula:"H₂",name:"Wasserstoffgas",state:"g"},{coefficient:1,formula:"O₂",name:"Sauerstoffgas",state:"g"}],products:[{coefficient:1,formula:"H₂O",name:"Wasser",state:"l"}],correctCoefficients:{reactants:[2,1],products:[2]},explanation:"Auf der linken Seite stehen bei 2 H₂ vier Wasserstoffatome und bei 1 O₂ zwei Sauerstoffatome. Rechts ergeben 2 H₂O ebenfalls exakt 4 H-Atome und 2 O-Atome! Das Gesetz der Massenerhaltung ist erfüllt.",didacticTip:"Zähle zuerst die Sauerstoffatome: O₂ bringt 2 O-Atome mit. Daher brauchst du rechts mindestens 2 H₂O.",realWorldContext:"Diese saubere Reaktion treibt Wasserstoff-Brennstoffzellen in Zügen und Bussen an; das einzige Abgas ist reines Wasser."},{id:"rx_methane_combustion",title:"Vollständige Verbrennung von Erdgas (Methan)",description:"Erdgas verbrennt mit Sauerstoff zu Kohlenstoffdioxid und Wasserdampf. Balanciere Kohlenstoff, Wasserstoff und zuletzt Sauerstoff aus.",reactants:[{coefficient:1,formula:"CH₄",name:"Methan",state:"g"},{coefficient:1,formula:"O₂",name:"Sauerstoff",state:"g"}],products:[{coefficient:1,formula:"CO₂",name:"Kohlenstoffdioxid",state:"g"},{coefficient:1,formula:"H₂O",name:"Wasserdampf",state:"g"}],correctCoefficients:{reactants:[1,2],products:[1,2]},explanation:"1 CH₄ liefert 1 C (passt zu 1 CO₂) und 4 H (benötigt 2 H₂O). Rechts sind nun insgesamt 2 (aus CO₂) + 2 (aus 2 H₂O) = 4 Sauerstoffatome. Links braucht man dafür 2 O₂.",didacticTip:"Regel: Balanciere reine Elemente wie O₂ immer ganz zum Schluss aus!",realWorldContext:"So brennt die blaue Flamme am Küchen-Gasherd oder in einer modernen Gastherme."},{id:"rx_ammonia_synthesis",title:"Haber-Bosch-Synthese (Ammoniak)",description:"Stickstoff aus der Luft wird mit Wasserstoff zu Ammoniak gebunden. Eine der bedeutendsten Reaktionen der modernen Chemiegeschichte.",reactants:[{coefficient:1,formula:"N₂",name:"Stickstoff",state:"g"},{coefficient:1,formula:"H₂",name:"Wasserstoff",state:"g"}],products:[{coefficient:1,formula:"NH₃",name:"Ammoniak",state:"g"}],correctCoefficients:{reactants:[1,3],products:[2]},explanation:"N₂ liefert 2 Stickstoffatome, deshalb entstehen rechts 2 NH₃. 2 NH₃ enthalten zusammen 6 Wasserstoffatome (2 × 3 = 6). Links benötigt man daher 3 Moleküle H₂ (3 × 2 = 6).",didacticTip:"Suche das kleinste gemeinsame Vielfache von 2 und 3 für den Wasserstoff!",realWorldContext:"Ermöglichte die Massenproduktion von mineralischem Dünger und ernährt heute fast die Hälfte der Menschheit."},{id:"rx_salt_synthesis",title:"Synthese von Natriumchlorid (Kochsalz)",description:"Das reaktive Metall Natrium reagiert mit dem giftigen Chlorgas zu harmlosem Speisesalz. Balanciere die Atome aus!",reactants:[{coefficient:1,formula:"Na",name:"Natrium",state:"s"},{coefficient:1,formula:"Cl₂",name:"Chlorgas",state:"g"}],products:[{coefficient:1,formula:"NaCl",name:"Natriumchlorid",state:"s"}],correctCoefficients:{reactants:[2,1],products:[2]},explanation:"1 Cl₂ bringt 2 Chloratome mit, daher müssen rechts 2 NaCl entstehen. Um die 2 Natriumatome bereitzustellen, benötigt man links 2 Na.",didacticTip:"Ein Halogenmolekül (Cl₂) besteht immer aus zwei Atomen. Das Produkt benötigt daher den Koeffizienten 2!",realWorldContext:"Ein eindrucksvoller Beweis: Zwei aggressive, gefährliche Reinstoffe verwandeln sich durch chemische Bindung in ein lebenswichtiges Speisesalz."},{id:"rx_water_electrolysis",title:"Wasser-Elektrolyse (Grüner Wasserstoff)",description:"Mittels elektrischem Strom wird flüssiges Wasser in reinen Wasserstoff und Sauerstoff gespalten.",reactants:[{coefficient:1,formula:"H₂O",name:"Wasser",state:"l"}],products:[{coefficient:1,formula:"H₂",name:"Wasserstoff",state:"g"},{coefficient:1,formula:"O₂",name:"Sauerstoff",state:"g"}],correctCoefficients:{reactants:[2],products:[2,1]},explanation:"2 H₂O enthalten 4 Wasserstoffatome und 2 Sauerstoffatome. Rechts entstehen 2 H₂ (4 H-Atome) und 1 O₂ (2 O-Atome). Die Masse bleibt exakt erhalten.",didacticTip:"Achte auf den Sauerstoff: O₂ verlangt links 2 H₂O!",realWorldContext:"Schlüsseltechnologie der Energiewende: Mit Wind- und Solarstrom wird so emissionsfreier grüner Wasserstoff als Energiespeicher produziert."}],Ms=[{id:"el_puzzle_01",title:"Die Glyphen der Alchemie",room:"elemental_lab",moduleId:"module_a",rewardElementAtomicNumber:1,type:"element_match",difficulty:"explorer",missionNumber:1,question:"Ordne den Elementsymbolen die korrekten deutschen Elementnamen zu!",loreContext:"Am Eingang des Elementarlabors leuchtet eine holografische Stele mit antiken und modernen Abkürzungen. Um die Sensoren zu kalibrieren, musst du die Symbole synchronisieren.",hint:'Viele Symbole stammen aus dem Lateinischen: "Fe" kommt von "Ferrum" (Eisen), "O" von "Oxygenium" (Sauerstoff).',detailedHint:"H steht für Wasserstoff (Hydrogenium), C für Kohlenstoff (Carbonium), O für Sauerstoff (Oxygenium) und Fe für Eisen (Ferrum).",didacticExplanation:"Elementsymbole bestehen weltweit aus einem Großbuchstaben oder einem Groß- gefolgt von einem Kleinbuchstaben. Sie sind eine universelle Weltsprache aller Wissenschaftler.",commonMistakeExplanation:'Achte darauf, das Symbol Fe nicht mit Fluor (F) zu verwechseln! Fe leitet sich vom lateinischen Wort "Ferrum" für Eisen ab.',realWorldExample:"Egal ob in Tokio, Berlin oder New York: Auf jeder Chemikalienflasche steht weltweit dasselbe Symbol.",xpReward:30,pairs:[{symbol:"H",name:"Wasserstoff",clue:"Das leichteste Element des Universums"},{symbol:"O",name:"Sauerstoff",clue:"Lebensnotwendig für unsere Atmung"},{symbol:"C",name:"Kohlenstoff",clue:"Die Basis aller organischen Lebewesen"},{symbol:"Fe",name:"Eisen",clue:"Magnetisches Schwermetall (Ferrum)"}]},{id:"el_puzzle_02",title:"Der Elementar-Wahrheitsfilter",room:"elemental_lab",moduleId:"module_a",rewardElementAtomicNumber:6,type:"true_false",difficulty:"explorer",missionNumber:2,question:"Prüfe die Aussage des Labor-Hauptrechners:",statement:"Ein chemisches Element besteht aus lauter Atomen mit der exakt gleichen Anzahl an Protonen im Atomkern.",isTrue:!0,loreContext:"Der Diagnose-Computer des Labors prüft dein Grundverständnis über die Bausteine der Materie, bevor er tiefere Systeme freischaltet.",hint:"Überlege, was die Ordnungszahl im Periodensystem bedeutet: Sie gibt genau die Zahl der Protonen an.",detailedHint:"Ein Goldatom hat immer 79 Protonen. Ändert man die Protonenzahl, entsteht ein völlig anderes Element!",didacticExplanation:"Richtig! Die Protonenzahl (Kernladungszahl / Ordnungszahl) definiert unverwechselbar das Element. Alle Wasserstoffatome besitzen 1 Proton, alle Kohlenstoffatome 6 Protonen.",commonMistakeExplanation:"Zwar kann die Neutronenzahl variieren (das nennt man dann Isotope), aber die Protonenzahl ist für jedes chemische Element immer streng identisch.",realWorldExample:"Ein Goldatom bleibt Gold, solange sein Kern 79 Protonen enthält – egal ob im Ehering oder tief im Erdinneren.",xpReward:25},{id:"el_puzzle_03",title:"Das flüchtige Edelgas",room:"elemental_lab",moduleId:"module_a",rewardElementAtomicNumber:2,type:"periodic_table_quiz",difficulty:"beginner",missionNumber:3,question:"Finde das gesuchte Element anhand der Labor-Detektordaten!",loreContext:"Ein Druckabfall im Kühlsystem hat ein Gas freigesetzt. Der Spektrograf meldet: Ordnungszahl 2, Gruppe 18, extrem leicht und völlig reaktionsträge.",hint:"Es ist das zweithäufigste Element im Weltall und wird in Ballons verwendet, weil es leichter als Luft ist.",detailedHint:"Suche ganz oben rechts im Periodensystem. Symbol: He.",didacticExplanation:"Hervorragend! Helium (He) besitzt die Ordnungszahl 2. Seine K-Schale ist mit 2 Elektronen voll besetzt (Duplett-Regel), weshalb es als Edelgas praktisch keine Bindungen eingeht.",commonMistakeExplanation:"Wasserstoff (H) ist zwar noch leichter (Ordnungszahl 1), aber hochentzündlich und gehört nicht zur Gruppe 18 (Edelgase).",realWorldExample:"Helium wird zur Kühlung supraleitender Spulen in Magnetresonanztomografen (MRT) auf minus 269 °C verflüssigt.",xpReward:35,targetSymbol:"He",criteriaDescription:"Edelgas der 1. Periode mit 2 Protonen und 2 Elektronen",clues:["Ordnungszahl: 2","Gruppe: 18 (Edelgase)","Aggregatzustand bei 20 °C: Gasförmig","Geht unter Normalbedingungen keine chemischen Verbindungen ein"]},{id:"el_puzzle_04",title:"Molekül-Synthese: Das Lebenselixier",room:"elemental_lab",moduleId:"module_b",rewardElementAtomicNumber:8,type:"molecule_builder",difficulty:"explorer",missionNumber:4,question:"Setze die Atome im Reaktionsbehälter zum Wassermolekül (H₂O) zusammen!",loreContext:"Die Notkühlung des Synthesereaktors benötigt reines Wasser. Die automatische Zufuhr ist leer, du musst das Molekül aus den Grundatomen synthetisieren.",hint:"Wasser besteht aus einem zweiwertigen Sauerstoffatom (O) und zwei einwertigen Wasserstoffatomen (H).",detailedHint:"Verwende 1 Sauerstoffatom und 2 Wasserstoffatome. Jedes H geht eine Bindung mit dem zentralen O ein.",didacticExplanation:"Perfekt gebaut! Sauerstoff benötigt 2 Bindungselektronen zur Erreichung der stabilen Edelgaskonfiguration. Jedes Wasserstoffatom steuert 1 Elektron bei.",commonMistakeExplanation:"Wasser ist nicht HO oder H2O2 (Wasserstoffperoxid), sondern H2O: 2 Teile Wasserstoff auf 1 Teil Sauerstoff.",realWorldExample:"Wasser bedeckt über 70 % der Erdoberfläche und ist das universelle Lösungsmittel für alle biochemischen Reaktionen in unseren Zellen.",xpReward:40,targetMolecule:ur.find(u=>u.id==="h2o"),availableAtomPool:[{symbol:"H",count:3,valency:1,color:"#e2e8f0"},{symbol:"O",count:2,valency:2,color:"#ef4444"},{symbol:"C",count:1,valency:4,color:"#334155"}]},{id:"el_puzzle_05",title:"Der Code des Chemikers",room:"elemental_lab",moduleId:"module_b",rewardElementAtomicNumber:3,type:"lab_door_cipher",difficulty:"beginner",missionNumber:5,doorName:"Vorratslager-Brandschutztür B-04",question:"Entschlüssele den dreistelligen Sicherheitscode der Brandschutztür!",loreContext:"Die Zwischentür zum Vorratslager ist verriegelt. Neben der Tastatur klebt eine Notiz des leitenden Professors mit chemischen Rätselhinweisen.",cipherClues:["Erste Ziffer: Die Anzahl der Protonen im Kohlenstoff-Atomkern (C)","Zweite Ziffer: Die Ordnungszahl des leichtesten Elements im Universum (H)","Dritte Ziffer: Die Anzahl der Valenzelektronen von Lithium (Gruppe 1 des Periodensystems)"],requiredCode:"611",keypadType:"numbers",options:["611","812","621","121"],scientificReason:"Kohlenstoff (C) = 6 Protonen; Wasserstoff (H) = Ordnungszahl 1; Lithium (Li, 1. Hauptgruppe) = 1 Valenzelektron. Ergibt den Code 611.",hint:"Schau auf das Periodensystem: Welche Ordnungszahl hat C? Welche H? Und wie viele Außenelektronen hat ein Alkalimetall?",detailedHint:"C steht an Stelle 6, H an Stelle 1, und alle Alkalimetalle der 1. Gruppe haben genau 1 Außenelektron. Code: 6 - 1 - 1.",didacticExplanation:"Zugang gewährt! Du hast Protonenzahlen und Valenzelektronen logisch kombiniert. Das Periodensystem ist wie eine Landkarte der Atomstrukturen geordnet.",commonMistakeExplanation:"Verwechsle nicht Atommasse mit Protonenzahl. Kohlenstoff wiegt rund 12 u, hat aber genau 6 Protonen.",realWorldExample:"Die Anzahl der Außenelektronen (Valenzelektronen) bestimmt das chemische Reaktionsverhalten von Elementen.",xpReward:45},{id:"el_puzzle_06",title:"Analyseprobe X-21: Das weiße Pulver",room:"elemental_lab",moduleId:"module_f",rewardElementAtomicNumber:11,type:"substance_analysis",difficulty:"beginner",missionNumber:6,question:"Führe virtuelle Tests an Probe X-21 durch und bestimme die chemische Identität!",loreContext:"Auf dem Labortisch steht eine unbeschriftete Kristallschale mit einem feinen weißen Pulver. Bevor der Arbeitsplatz gereinigt werden kann, muss der Stoff sicher identifiziert werden.",hint:"Achte auf die Flammenfärbung: Natrium färbt eine Bunsenbrennerflamme intensiv leuchtend gelb.",detailedHint:"Sehr gut wasserlöslich, leitet als Lösung den Strom (Elektrolyt) und schmeckt salzig: Es handelt sich um Natriumchlorid (Kochsalz).",didacticExplanation:"Präzise Analytik! Natriumchlorid (NaCl) dissoziiert in Wasser zu frei beweglichen Na⁺- und Cl⁻-Ionen, die Strom leiten. Die Flammenfärbung bestätigt das Natriumkation.",commonMistakeExplanation:"Zucker (Saccharose) löst sich zwar auch im Wasser, bildet aber keine Ionen und leitet daher keinen elektrischen Strom!",realWorldExample:"Klassische chemische Kationennachweise nutzen Flammenfärbungen – z. B. auch bei buntem Feuerwerk am Silvesterhimmel.",xpReward:50,sample:{id:"substance_nacl",name:"Probe X-21",formula:"NaCl",appearance:"Weißes, geruchloses kristallines Pulver",state:"solid",solubilityInWater:"very_soluble",pHValue:7,flameTestColor:"Intensives, leuchtendes Gelb (charakteristisch für Natrium)",conductivity:"leiter",hintClues:["Löst sich vollständig und klar in Wasser auf","Die wässrige Lösung leitet elektrischen Strom sehr gut","pH-Wert der Lösung ist exakt 7 (neutral)","Flammenprobe: Kräftige gelbe Flammenfärbung"],safeLabWarning:"Im Labor niemals Proben mit dem Mund probieren! Nutze ausschließlich spektroskopische und physikalische Tests.",correctIdentity:"Natriumchlorid (Kochsalz, NaCl)"},testOptions:[{id:"flame",testName:"Flammenfärbung (Bunsenbrenner)",observation:"Die Probe färbt die Flamme intensiv hellgelb!",safeProcedure:"Etwas Substanz mit einer Magnesiastäbchenöse in die nicht leuchtende Bunsenbrennerflamme halten."},{id:"conductivity",testName:"Leitfähigkeitsprüfung der Lösung",observation:"Die Prüflampe leuchtet hell auf: Ionen leiten den Strom.",safeProcedure:"Substanz in destilliertem Wasser lösen und Elektroden eintauchen."},{id:"ph",testName:"pH-Indikatorstreifen",observation:"Der Teststreifen bleibt grün: pH-Wert = 7.0 (neutral).",safeProcedure:"Einen Tropfen der Lösung auf Universalindikatorpapier geben."}],candidateChoices:["Natriumchlorid (Kochsalz, NaCl)","Saccharose (Haushaltszucker, C12H22O11)","Calciumcarbonat (Kalk, CaCO3)","Kupfersulfat (CuSO4)"]},{id:"el_puzzle_07",title:"Die Gleichung der Knallgasreaktion",room:"elemental_lab",moduleId:"module_c",rewardElementAtomicNumber:17,type:"equation_balancer",difficulty:"beginner",missionNumber:7,question:"Bringe die chemische Gleichung der Wassersynthese ins Gleichgewicht!",loreContext:"Am Hauptwanddisplay des Reaktionsbereichs blinkt eine unvollständige Gleichung. Vor dem Start der Syntheseanlage müssen die Koeffizienten stimmen.",hint:"Zähle die Atome: Links sind in O₂ zwei Sauerstoffatome. Rechts im H₂O ist nur eines. Du brauchst also 2 H₂O!",detailedHint:"Setze 2 vor H₂ und 2 vor H₂O. Dann hast du links: 4 H und 2 O; rechts: 4 H und 2 O.",didacticExplanation:"Gleichung perfekt ausbalanciert! 2 H₂ + 1 O₂ → 2 H₂O. Atome können bei einer chemischen Reaktion weder entstehen noch vergehen (Gesetz von Lavoisier).",commonMistakeExplanation:"Man darf niemals die kleinen Indexzahlen in den Formeln ändern (z. B. H2O zu H2O2 machen), sondern nur die großen Koeffizienten vor den Molekülen anpassen!",realWorldExample:"Chemieingenieure müssen jede industrielle Synthese exakt berechnen, damit keine teuren Rohstoffe unverbraucht verloren gehen.",xpReward:45,reaction:_s[0]},{id:"el_puzzle_08",title:"Fallakte 01: Das angelaufene Silberbesteck",room:"elemental_lab",moduleId:"module_e",rewardElementAtomicNumber:79,type:"mystery_detective",difficulty:"advanced",missionNumber:8,question:"Untersuche die Beweise und bestimme die wissenschaftlich korrekte Ursache!",caseTitle:"Das Geheimnis der schwarzen Gabeln",caseReport:"Im historischen Speisesaal des Instituts ist das ehemals glänzende Silberbesteck dunkelgrau bis tiefschwarz angelaufen. Ein Mitarbeiter vermutet einfachen Dreck oder Staub, doch die Analyse zeigt eine chemische Umwandlung.",loreContext:"Als wissenschaftlicher Chefermittler wirst du gerufen, um den chemischen Vorgang aufzuklären.",hint:"Reines Silber reagiert an der Luft nicht mit Sauerstoff (es ist ein Edelmetall), aber sehr empfindlich mit Spuren von Schwefelverbindungen (z.B. aus Eiern oder Schwefelwasserstoff in der Luft).",detailedHint:"Der schwarze Belag ist Silbersulfid (Ag₂S). Schwefelhaltige Proteine oder Gase sind die Täter.",didacticExplanation:"Exzellente Detektivarbeit! Silber ist zwar edel und oxidiert nicht mit Sauerstoff, reagiert aber spontan mit Schwefelwasserstoff (H₂S) zu schwarzem Silbersulfid (Ag₂S).",commonMistakeExplanation:"Es handelt sich nicht um Rost (Eisenoxid), denn Silber enthält kein Eisen. Auch ist es keine Rußablagerung, sondern eine echte chemische Verbindung.",realWorldExample:"Gekochte Eier enthalten schwefelhaltige Aminosäuren. Isst man ein Ei mit einem Silberlöffel, läuft dieser sofort dunkel an!",xpReward:60,evidenceItems:[{title:"Beweis A: Chemische Analyse des Belags",fact:"Die Schicht besteht aus Silberatomen (Ag) und Schwefelatomen (S) im Verhältnis 2:1 (Ag₂S)."},{title:"Beweis B: Umgebungsbericht",fact:"In der Nähe wurden frische Eierspeisen zubereitet und ein alter Gummischlauch gelagert (beides schwefelhaltig)."},{title:"Beweis C: Beständigkeitstest",fact:"Der schwarze Belag lässt sich mit Wasser und Spülmittel nicht abwaschen, löst sich aber bei einer elektrochemischen Reduktion in Alufolie mit Salzwasser."}],hypotheses:[{id:"hyp_1",text:"Silber reagiert mit Schwefelverbindungen aus Luft und Nahrung zu schwarzem Silbersulfid (Ag₂S).",isCorrect:!0,scientificCritique:"Vollkommen zutreffend! Dies ist die exakte chemische Erklärung für das Anlaufen von Silber."},{id:"hyp_2",text:"Das Silber ist durch Sauerstoff verrostet, genau wie eine alte Eisenstange im Regen.",isCorrect:!1,scientificCritique:"Falsch: Silber ist ein Edelmetall und bildet an normaler Luft kein stabiles Oxid. Rost existiert nur bei Eisen."},{id:"hyp_3",text:"Es handelt sich lediglich um gewöhnlichen Fett- und Küchenstaub, der mechanisch anhaftet.",isCorrect:!1,scientificCritique:"Widerlegt: Beweis C zeigt, dass normales Waschen versagt, weil eine echte chemische Bindung vorliegt."}]},{id:"el_puzzle_09",title:"Physikalisch oder Chemisch?",room:"elemental_lab",moduleId:"module_f",rewardElementAtomicNumber:12,type:"true_false",difficulty:"beginner",missionNumber:9,question:"Bewerte diesen physikalisch-chemischen Vorgang:",statement:"Wenn Eiswürfel im Glas zu flüssigem Wasser schmelzen, handelt es sich um eine chemische Reaktion.",isTrue:!1,loreContext:"Die Umweltstation des Elementarlabors überwacht Phasenumwandlungen im Kühlkreislauf.",hint:"Ändert sich die Molekülformel beim Schmelzen von Eis, oder bleiben es weiterhin H₂O-Moleküle?",detailedHint:"Beim Schmelzen ändert sich nur der Aggregatzustand (die Anordnung der Moleküle). Es entstehen keine neuen Stoffe.",didacticExplanation:"Richtig erkannt: Falsch! Schmelzen ist eine rein physikalische Zustandsänderung (Phasenübergang). Sowohl Eis als auch flüssiges Wasser und Wasserdampf bestehen aus identischen H₂O-Molekülen.",commonMistakeExplanation:"Bei einer chemischen Reaktion müssen chemische Bindungen gebrochen und neue Stoffe mit veränderten Eigenschaften gebildet werden. Beim Schmelzen ändern sich nur die Abstände zwischen den unveränderten Molekülen.",realWorldExample:"Wenn Schokolade in der Sonne schmilzt, ist das physikalisch. Verbrennt man sie im Ofen zu Asche und Rauch, ist das chemisch.",xpReward:30},{id:"el_puzzle_10",title:"Die Trennlinie der Elemente",room:"elemental_lab",moduleId:"module_a",rewardElementAtomicNumber:26,type:"periodic_table_quiz",difficulty:"beginner",missionNumber:10,question:"Welches dieser Elemente ist ein reaktives Übergangsmetall und lebensnotwendig für den menschlichen Sauerstofftransport im roten Blutfarbstoff?",loreContext:"Zum Abschluss der Elementarlabor-Prüfung testet das System dein Verständnis über Spurenelemente und Metalle.",hint:"Achtung: Im Hämoglobin bindet ein Übergangsmetall den Sauerstoff. Symbol: Fe (Ferrum).",detailedHint:"Suche in Periode 4, Gruppe 8. Ordnungszahl 26.",didacticExplanation:"Glückwunsch! Eisen (Fe) ist ein Übergangsmetall (Ordnungszahl 26). Ein Fe²⁺-Kation sitzt im Zentrum des Häm-Komplexes und bindet reversibel das O₂-Molekül.",commonMistakeExplanation:"Sauerstoff transportiert sich nicht selbst – er benötigt das zweiwertige Eisenkation als molekulare Andockstation in unseren roten Blutkörperchen.",realWorldExample:"Eisenmangel führt zu Müdigkeit, weil die Muskeln und das Gehirn zu wenig Sauerstoff erhalten.",xpReward:40,targetSymbol:"Fe",criteriaDescription:"Übergangsmetall der 4. Periode mit Ordnungszahl 26",clues:["Ordnungszahl: 26","Symbol: Fe","Gruppe: 8 (Übergangsmetalle)","Zentrales Atom im roten Blutfarbstoff Hämoglobin"]},{id:"atom_puzzle_01",title:"Der Kern des Leuchtens",room:"atom_chamber",moduleId:"module_b",rewardElementAtomicNumber:10,type:"periodic_table_quiz",difficulty:"beginner",missionNumber:1,question:"Welches Edelgas besitzt genau 10 Protonen und 10 Elektronen?",loreContext:"In der Atomkammer untersuchst du die Kernladungszahlen stabiler Atome mit vollbesetzten Schalen.",hint:"Es steht in Periode 2, Gruppe 18 und leuchtet intensiv orangerot in Gasentladungsröhren.",detailedHint:"Ordnungszahl 10 entspricht dem Edelgas Neon (Ne).",didacticExplanation:"Korrekt! Neon hat die Ordnungszahl 10, besitzt 10 Protonen im Kern und eine vollständig mit 8 Valenzelektronen gefüllte L-Schale (Edelgaskonfiguration).",commonMistakeExplanation:"Helium hat nur 2 Protonen, Argon dagegen 18 Protonen. Nur Neon hat genau 10 Protonen.",realWorldExample:"Klassische rote Neon-Reklameschilder über Theatern und Kinos.",xpReward:40,targetSymbol:"Ne",criteriaDescription:"Edelgas mit genau 10 Protonen und 10 Elektronen",clues:["Ordnungszahl: 10","Gruppe: 18 (Edelgase)","Periode: 2"]},{id:"atom_puzzle_02",title:"Das Codeschloss der Ionenfalle",room:"atom_chamber",moduleId:"module_b",rewardElementAtomicNumber:9,type:"lab_door_cipher",difficulty:"advanced",missionNumber:2,doorName:"Ionenspeicher-Magnetkammer",question:"Berechne den 3-stelligen Code aus den Ladungen und Elektronenzahlen!",loreContext:"Die Ionenfalle hält geladene Teilchen in einem Magnetfeld gefangen. Der Code berechnet sich aus Atombausteinen.",cipherClues:["Ziffer 1: Anzahl der Protonen in einem Fluoratom (F)","Ziffer 2: Elektronen auf der innersten K-Schale eines beliebigen Atoms (außer H)","Ziffer 3: Ladungszahl eines Natriumkations (Na⁺)"],requiredCode:"921",keypadType:"numbers",options:["921","721","911","920"],scientificReason:"Fluor = 9 Protonen; K-Schale fasst max. 2 Elektronen; Natriumion Na⁺ hat eine einfache positive Ladung (+1). Code: 921.",hint:"Fluor hat Ordnungszahl 9. Die erste Schale (K-Schale) fasst maximal 2 Elektronen.",detailedHint:"Code: 9 (Protonen F) - 2 (K-Schale voll) - 1 (Ladung Na+).",didacticExplanation:"Hervorragend! Ionen entstehen, wenn Atome Elektronen abgeben (positiv geladene Kationen wie Na⁺) oder aufnehmen (negativ geladene Anionen wie F⁻).",commonMistakeExplanation:"Die Kernladung (Protonen) ändert sich bei der Ionenbildung niemals – nur die Anzahl der Elektronen in der Hülle variiert!",realWorldExample:"Lithium- und Natriumionen wandern beim Laden und Entladen in modernen Akkumulatoren.",xpReward:45},{id:"atom_puzzle_03",title:"Atomhülle und Ladungsneutralität",room:"atom_chamber",moduleId:"module_b",type:"true_false",difficulty:"explorer",missionNumber:3,question:"Bewerte die Aussage über neutrale Atome:",statement:"In einem elektrisch ungeladenen (neutralen) Atom ist die Anzahl der positiv geladenen Protonen exakt gleich der Anzahl der negativ geladenen Elektronen.",isTrue:!0,loreContext:"Der Sensor kalibriert das elektrische Feld der Atomkammer.",hint:"Plus und Minus müssen sich gegenseitig aufheben, damit keine Ladung nach außen wirkt.",detailedHint:"Protonen tragen +1, Elektronen -1. Bei gleicher Anzahl ist die Gesamtladung exakt 0.",didacticExplanation:"Richtig! Weil die elektrische Ladung eines Protons (+1e) genau entgegengesetzt gleich der eines Elektrons (-1e) ist, heben sie sich bei gleicher Anzahl nach außen perfekt auf.",commonMistakeExplanation:"Neutronen tragen keine elektrische Ladung, tragen aber zur Masse des Kerns bei.",realWorldExample:"Ein Stück fester Kohlenstoff oder ein Eisenstab fühlt sich elektrisch neutral an, weil Kernladungen und Hüllenelektronen im Gleichgewicht sind.",xpReward:35},{id:"atom_puzzle_04",title:"Fallakte 02: Die Radiokarbon-Zeitreise",room:"atom_chamber",moduleId:"module_b",rewardElementAtomicNumber:6,type:"mystery_detective",difficulty:"advanced",missionNumber:4,question:"Welches Phänomen ermöglicht es Archäologen, das Alter uralter Holzfunde exakt zu bestimmen?",caseTitle:"Das Geheimnis der Wikinger-Schiffsrümpfe",caseReport:"In einem Labor werden Holzreste eines Wikingerschiffes untersucht. Der Forscher stellt fest, dass ein bestimmtes Kohlenstoff-Isotop langsam zerfällt.",loreContext:"Ein historisches Rätsel über Isotope und Radioaktivität.",hint:"Isotope eines Elements haben gleich viele Protonen, aber unterschiedlich viele Neutronen. Das seltene Kohlenstoff-14 (C-14) ist instabil und zerfällt mit einer Halbwertszeit von ca. 5730 Jahren.",detailedHint:"Das Verhältnis von C-14 zu stabilem C-12 verrät das Alter seit dem Absterben des Baumes.",didacticExplanation:"Präzise detektiert! Alle lebenden Organismen nehmen über die Nahrung oder Fotosynthese Kohlenstoff auf. Nach dem Tod stoppt die Aufnahme, und das instabile C-14-Isotop zerfällt messbar.",commonMistakeExplanation:"C-12 ist absolut stabil und zerfällt nie. Nur das seltene Isotop C-14 (mit 8 Neutronen statt 6) ist radioaktiv.",realWorldExample:"Mit der C-14-Methode wurde das Alter der Gletschermumie „Ötzi“ auf ca. 5300 Jahre datiert.",xpReward:55,evidenceItems:[{title:"Beweis A: Isotopenverteilung",fact:"Normaler Kohlenstoff ist C-12 (6 Protonen, 6 Neutronen). In der Atmosphäre gibt es Spuren von C-14 (6 Protonen, 8 Neutronen)."},{title:"Beweis B: Biologischer Stopp",fact:"Solange ein Baum lebt, entspricht sein C-14-Anteil dem der Luft. Stirbt das Holz ab, zerfällt C-14 kontinuierlich."},{title:"Beweis C: Halbwertszeit",fact:"Nach 5730 Jahren ist genau die Hälfte der C-14-Kerne zerfallen."}],hypotheses:[{id:"hyp_c14",text:"Instabile Kohlenstoff-14-Isotope zerfallen nach dem Absterben des Holzes mit bekannter Halbwertszeit.",isCorrect:!0,scientificCritique:"Exakt! Dies ist die physikalisch-chemische Grundlage der C-14-Radiokarbondatierung."},{id:"hyp_wood_rot",text:"Bakterien fressen bevorzugt Eisenatome im Holz, was das Alter anzeigt.",isCorrect:!1,scientificCritique:"Falsch: Holz besteht aus Cellulose (Kohlenstoff, Wasserstoff, Sauerstoff), nicht aus Eisen."}]},{id:"mol_puzzle_01",title:"Erdgas-Synthese: Das Methanmolekül",room:"molecule_workshop",moduleId:"module_b",rewardElementAtomicNumber:1,type:"molecule_builder",difficulty:"beginner",missionNumber:1,question:"Konstruiere das Methan-Molekül (CH₄) mit voller Tetraeder-Valenz!",loreContext:"Die Triebwerke der Labor-Generatoren benötigen Erdgas. Baue das einfachste Kohlenwasserstoff-Molekül zusammen.",hint:"Kohlenstoff (C) benötigt 4 Bindungen, Wasserstoff (H) jeweils 1 Bindung.",detailedHint:"Verwende 1 Kohlenstoffatom und 4 Wasserstoffatome im Baukasten.",didacticExplanation:"Perfekt gebaut! Methan (CH₄) ist ein symmetrisches Molekül. Der vierwertige Kohlenstoff teilt sich mit 4 Wasserstoffen je ein Elektronenpaar (kovalente Einfachbindung).",commonMistakeExplanation:"Kohlenstoff kann in stabilen Molekülen praktisch nie nur 2 oder 3 Bindungen haben – er strebt nach der Oktettregel mit 8 Valenzelektronen.",realWorldExample:"Methan ist der Hauptbestandteil von Erdgas und Biogas zum Heizen und Kochen.",xpReward:40,targetMolecule:ur.find(u=>u.id==="ch4"),availableAtomPool:[{symbol:"C",count:1,valency:4,color:"#334155"},{symbol:"H",count:5,valency:1,color:"#e2e8f0"},{symbol:"O",count:1,valency:2,color:"#ef4444"}]},{id:"mol_puzzle_02",title:"Treibhausgas-Synthese: Kohlenstoffdioxid",room:"molecule_workshop",moduleId:"module_b",rewardElementAtomicNumber:6,type:"molecule_builder",difficulty:"beginner",missionNumber:2,question:"Baue ein Kohlenstoffdioxid-Molekül (CO₂) zusammen!",loreContext:"Die Gewächshauskuppel des Umweltlabors benötigt CO₂ für die Pflanzenfotosynthese.",hint:"Im CO₂ bildet das zentrale Kohlenstoffatom zu zwei Sauerstoffatomen jeweils eine Doppelbindung aus.",detailedHint:"Kombiniere 1 Kohlenstoffatom mit 2 Sauerstoffatomen.",didacticExplanation:"Hervorragend! Im CO₂-Molekül (O=C=O) sind alle Valenzen perfekt gesättigt. Kohlenstoff bildet zwei kovalente Doppelbindungen.",commonMistakeExplanation:"CO ist Kohlenstoffmonoxid (giftig!). CO₂ ist Kohlenstoffdioxid mit 2 Sauerstoffatomen.",realWorldExample:"Pflanzen spalten CO₂ im Sonnenlicht und bauen daraus Glucose (Zucker) und Sauerstoff auf.",xpReward:45,targetMolecule:ur.find(u=>u.id==="co2"),availableAtomPool:[{symbol:"C",count:2,valency:4,color:"#334155"},{symbol:"O",count:3,valency:2,color:"#ef4444"},{symbol:"H",count:2,valency:1,color:"#e2e8f0"}]},{id:"mol_puzzle_03",title:"Dünger-Baustein: Ammoniak (NH₃)",room:"molecule_workshop",moduleId:"module_b",rewardElementAtomicNumber:7,type:"molecule_builder",difficulty:"advanced",missionNumber:3,question:"Setze das Ammoniak-Molekül (NH₃) aus Stickstoff und Wasserstoff zusammen!",loreContext:"Die Stickstoff-Syntheseanlage benötigt Ammoniak als Ausgangsstoff.",hint:"Stickstoff (N) ist dreiwertig und bindet drei Wasserstoffatome (H).",detailedHint:"Füge 1 Stickstoffatom und 3 Wasserstoffatome in die Kammer ein.",didacticExplanation:"Struktur vollendet! Das NH₃-Molekül hat die Form einer dreiseitigen Pyramide mit einem freien Elektronenpaar an der Spitze des Stickstoffatoms.",commonMistakeExplanation:"Reiner Stickstoff in der Luft ist N₂. Im Ammoniak ist ein N mit 3 H-Atomen verknüpft.",realWorldExample:"Ammoniak wird industriell zur Herstellung von Düngemitteln verwendet, um Getreidefelder fruchtbar zu machen.",xpReward:50,targetMolecule:ur.find(u=>u.id==="nh3"),availableAtomPool:[{symbol:"N",count:1,valency:3,color:"#38bdf8"},{symbol:"H",count:4,valency:1,color:"#e2e8f0"},{symbol:"O",count:1,valency:2,color:"#ef4444"}]},{id:"mol_puzzle_04",title:"Atom vs. Molekül vs. Verbindung",room:"molecule_workshop",moduleId:"module_b",type:"true_false",difficulty:"beginner",missionNumber:4,question:"Prüfe diesen sprachlichen und fachlichen Unterschied:",statement:"Jede chemische Verbindung ist aus Molekülen oder Ionen aufgebaut, aber nicht jedes Molekül ist eine chemische Verbindung (z. B. besteht O₂ aus nur einer Atomsorte).",isTrue:!0,loreContext:"Der Didaktik-Leitfaden des Instituts schärft den exakten Gebrauch von Fachbegriffen.",hint:'Eine "Verbindung" erfordert mindestens zwei verschiedene chemische Elemente. O₂ besteht nur aus Sauerstoff.',detailedHint:"O₂ ist ein Molekül, aber ein Element. H₂O ist ein Molekül UND eine chemische Verbindung.",didacticExplanation:"Präzise differenziert! O₂ oder N₂ sind Moleküle, aber reine Elemente, da sie nur aus einer Atomsorte bestehen. H₂O oder CO₂ bestehen aus verschiedenen Elementen und sind daher echte Verbindungen.",commonMistakeExplanation:'Im Alltag werden "Stoff", "Molekül" und "Verbindung" oft verwechselt. Wissenschaftlich ist die Unterscheidung glasklar.',realWorldExample:"Sauerstoffgas in der Atemluft liegt fast ausschließlich als zweiatomiges Molekül O₂ vor.",xpReward:35},{id:"rx_puzzle_01",title:"Verbrennung von Methan",room:"reaction_room",moduleId:"module_c",rewardElementAtomicNumber:6,type:"equation_balancer",difficulty:"advanced",missionNumber:1,question:"Gleiche die Verbrennung von Erdgas (CH₄ + O₂ → CO₂ + H₂O) stöchiometrisch aus!",loreContext:"In der Brennkammer des Reaktionsraums muss das Brennstoff-Sauerstoff-Verhältnis exakt stimmen.",hint:"1 CH₄ liefert 4 H-Atome, braucht also rechts 2 H₂O. Zähle danach den gesamten Sauerstoff!",detailedHint:"Links: 1 CH₄ + 2 O₂. Rechts: 1 CO₂ + 2 H₂O. Beide Seiten haben dann: 1 C, 4 H, 4 O.",didacticExplanation:"Gleichung balanciert! 1 CH₄ + 2 O₂ → 1 CO₂ + 2 H₂O. Vollständige Verbrennung erzeugt blaues Licht und saubere Verbrennungsprodukte.",commonMistakeExplanation:"Vergiss nicht, dass sowohl im CO₂ als auch im H₂O Sauerstoffatome stecken, die addiert werden müssen!",realWorldExample:"Bei unzureichender Sauerstoffzufuhr (weniger als 2 O₂) entsteht gefährliches Kohlenmonoxid (CO).",xpReward:50,reaction:_s[1]},{id:"rx_puzzle_02",title:"Die Haber-Bosch-Reaktionsschleife",room:"reaction_room",moduleId:"module_c",rewardElementAtomicNumber:7,type:"equation_balancer",difficulty:"advanced",missionNumber:2,question:"Bringe die Stickstoff-Wasserstoff-Synthese ins stöchiometrische Gleichgewicht!",loreContext:"Am Hochdruckreaktor soll die Ammoniaksynthese gestartet werden.",hint:"N₂ hat 2 N-Atome, rechts entstehen 2 NH₃. Wie viele H-Atome (H₂) brauchst du für 6 H?",detailedHint:"1 N₂ + 3 H₂ → 2 NH₃.",didacticExplanation:"Perfekt ausgerechnet! 1 N₂ + 3 H₂ → 2 NH₃. 2 N-Atome und 6 H-Atome auf beiden Seiten.",commonMistakeExplanation:'Man kann nicht einfach "N + 3 H" schreiben, eren überspringt den flüssigen Zustand vollständig (z. B. Trockeneis CO₂).",realWorldExample:"Wäsche trocknet im Winter selbst bei Minusgraden im Freien durch Sublimation von Eis zu Wasserdampf.",xpReward:40,pairs:[{symbol:"Fest→Flüssig",name:"Schmelzen",clue:"Eis wird zu flüssigem Wasser"},{symbol:"Flüssig→Gas",name:"Verdampfen",clue:"Wasser kocht im Kessel"},{symbol:"Gas→Flüssig",name:"Kondensieren",clue:"Wasserdampf beschlägt am kalten Fenster"},{symbol:"Fest→Gas",name:"Sublimieren",clue:"Trockeneis wird ohne Schmelzen direkt zu Gas"}]},{id:"crys_puzzle_04",title:"Fallakte 03: Echtes Gold oder Narrengold?",room:"crystal_archive",moduleId:"module_f",rewardElementAtomicNumber:79,type:"mystery_detective",difficulty:"advanced",missionNumber:4,question:"Entlarve die Fälschung anhand der Dichte und Stoffeigenschaften!",caseTitle:"Der verdächtige Klumpen im Kristallgewölbe",caseReport:"Ein Besucher behauptet, einen riesigen 1-Kilogramm-Goldnugget gefunden zu haben. Die optische Farbe glänzt golden, doch das Volumen weckt Zweifel.",loreContext:"Archimedes lässt grüßen: Die Dichte entlarvt das Geheimnis.",hint:"Echtes Gold hat eine gigantische Dichte von ca. 19,3 g/cm³. Katzengold (Pyrit, FeS₂) wiegt bei gleichem Volumen nur rund ein Viertel (ca. 5,0 g/cm³).",detailedHint:"Ein Goldklumpen von 100 cm³ müsste fast 2 Kilogramm wiegen.",didacticExplanation:"Bravo! Durch Verdrängung im Wasserglas (Auftriebsmethode nach Archimedes) lässt sich das exakte Volumen und damit die Dichte (Masse geteilt durch Volumen) zweifelsfrei bestimmen.",commonMistakeExplanation:"Farbe und Glanz können täuschen, physikalische Kennzahlen wie die Dichte lügen nie.",realWorldExample:"Juweliere und Prüfstellen wiegen Gold unter Wasser, um Wolframfälschungen aufzudecken.",xpReward:60,evidenceItems:[{title:"Beweis A: Massemessung",fact:"Der Klumpen wiegt genau 500 Gramm."},{title:"Beweis B: Wasserverdrängung (Volumen)",fact:"Beim Eintauchen verdrängt der Klumpen exakt 100 Milliliter (100 cm³) Wasser."},{title:"Beweis C: Dichteberechnung",fact:"Dichte = 500 g / 100 cm³ = 5,0 g/cm³. (Gold hätte 19,3 g/cm³)."}],hypotheses:[{id:"hyp_pyrit",text:"Es handelt sich um Pyrit („Katzengold“, Eisendisulfid FeS₂) mit einer Dichte von 5,0 g/cm³, keinesfalls um echtes Gold.",isCorrect:!0,scientificCritique:"Exakt begründet! Die berechnete Dichte von 5,0 g/cm³ passt perfekt zu Pyrit, Gold wäre fast viermal schwerer."},{id:"hyp_real_gold",text:"Es ist echtes Reingold, das durch kosmische Strahlung an Dichte verloren hat.",isCorrect:!1,scientificCritique:"Falsch: Die Dichte von reinem Gold ist eine feste physikalische Stoffkonstante."}]},{id:"water_puzzle_01",title:"Der pH-Code der Neutralisationsschleuse",room:"water_station",moduleId:"module_d",type:"lab_door_cipher",difficulty:"beginner",missionNumber:1,doorName:"Neutralisations-Schleusentor",question:"Ermittle den 3-stelligen Freischaltcode anhand der pH-Werte!",loreContext:"Die Abwasserreinigungsstufe schließt bei extremen pH-Werten ab. Nur der neutrale Code öffnet das Tor.",cipherClues:["Erste Ziffer: Der pH-Wert von reinem, neutralem Wasser bei 25 °C","Zweite Ziffer: pH-Wert einer starken Säure (typischer Wert im Magensaft: pH 1 bis 2)","Dritte Ziffer: Ein typischer basischer pH-Wert von milder Seifenlösung (pH 9 bis 10)"],requiredCode:"719",keypadType:"numbers",options:["719","700","179","729"],scientificReason:"Neutral = pH 7; Magensäure = pH 1; Seifenlauge = pH 9. Ergibt 719.",hint:"pH 7 ist exakt neutral (weder sauer noch basisch). Werte unter 7 sind sauer, über 7 basisch (alkalisch).",detailedHint:"Code: 7 (Neutral) - 1 (Sauer) - 9 (Basisch).",didacticExplanation:"Zugang autorisiert! Die pH-Skala ist logarithmisch: Eine Änderung um 1 pH-Stufe bedeutet eine zehnfache Änderung der Hydronium-Ionen-Konzentration (H₃O⁺).",commonMistakeExplanation:'pH 0 bedeutet nicht "keine Säure", sondern extrem stark sauer!',realWorldExample:"Blut hat einen lebenswichtigen pH-Pufferbereich von exakt 7,35 bis 7,45.",xpReward:45},{id:"water_puzzle_02",title:"Wasser als Dipolmolekül",room:"water_station",moduleId:"module_e",rewardElementAtomicNumber:8,type:"true_false",difficulty:"beginner",missionNumber:2,question:"Bewerte die Molekülstruktur des Wassers:",statement:"Weil Sauerstoff elektronegativer als Wasserstoff ist und das Wassermolekül gewinkelt ist, besitzt Wasser einen positiven und einen negativen Ladungspol (Dipol).",isTrue:!0,loreContext:"Das Spektrometer analysiert die Oberflächenspannung des Wassers.",hint:"Sauerstoff zieht die Bindungselektronen stärker an sich (partiell negativ, δ⁻).",detailedHint:"Die gewinkelte Struktur (ca. 104,5°) verhindert, dass sich die Ladungsschwerpunkte aufheben.",didacticExplanation:"Vollkommen richtig! Der Dipolcharakter ermöglicht Wasserstoffbrückenbindungen. Daher siedet Wasser erst bei 100 °C und besitzt eine Dichteanomalie.",commonMistakeExplanation:"Wäre Wasser linear (wie CO₂), würden sich die Dipole aufheben und Wasser wäre bei Raumtemperatur ein Gas!",realWorldExample:"Wasserläufer können über Teiche laufen, weil Wasserstoffbrücken eine starke Oberflächenspannung erzeugen.",xpReward:40},{id:"water_puzzle_03",title:"Indikator-Farben im Testlabor",room:"water_station",moduleId:"module_d",type:"substance_analysis",difficulty:"beginner",missionNumber:3,question:"Analysiere die Lösung anhand des Universalindikators und bestimme den Stoff!",loreContext:"Eine verschüttete Küchenflüssigkeit soll neutralisiert werden.",hint:"Universalindikator färbt sich bei stark sauren Lösungen (pH 2-3) intensiv rot-orange.",detailedHint:"Zitronensaft enthält Zitronensäure (pH ca. 2,4) und schmeckt sauer.",didacticExplanation:"Zitronensaft sicher identifiziert! Säuren geben Protonen (H⁺) an Wasser ab, wodurch H₃O⁺-Ionen entstehen, die den Indikator rot färben.",commonMistakeExplanation:"Seifenwasser färbt den Indikator blau oder violett (basisch), destilliertes Wasser bleibt grün (pH 7).",realWorldExample:"Rotkohlsaft ist ein natürlicher Indikator: Bei Säurezugabe wird er le
